services:
  app:
    image: ${IMAGE}
    pull_policy: "missing"
    init: true
    volumes:
      - type: bind
        source: ${PWD}
        target: ${PWD}
        consistency: "consistent"
      # This allows access to Git configuration so Git commands work
      - type: bind
        source: ${GIT_CONFIG}
        target: "/home/appuser/.gitconfig"
      - type: bind
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
      - type: bind
        source: ${PWD}/dx/state/.pi/
        target: /home/appuser/.pi
        consistency: "consistent"
    command: /home/appuser/show-help-in-app-container-then-wait.sh
    working_dir: ${PWD}
    environment:
      TERM: ${TERM}
      PROJECT_ROOT: ${PWD}
    ports:
      - "8086:8086"
      - "8087:8087"
      - "127.0.0.1:8088:8192"


